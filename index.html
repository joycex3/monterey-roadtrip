  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

        <div onclick=\"{{ opt.onToggle }}\" style=\"{{ opt.cardStyle }}\" style-hover=\"box-shadow: 0 10px 24px rgba(0,0,0,.22); transform: translateY(-2px)\">\n          <div style=\"{{ opt.checkStyle }}\">\n            <sc-if value=\"{{ opt.selected }}\">\n              <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M5 13l4 4L19 7\" stroke=\"#EBD592\" stroke-width=\"3.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <div style=\"flex:1;min-width:0;\">\n            <div style=\"{{ opt.labelStyle }}\">{{ opt.label }}<\u002Fdiv>\n            <sc-if value=\"{{ opt.notLink }}\"><div style=\"{{ opt.subStyle }}\">{{ opt.sub }}<\u002Fdiv><\u002Fsc-if>\n            <sc-if value=\"{{ opt.isLink }}\"><a href=\"{{ opt.subHref }}\" target=\"_blank\" rel=\"noopener\" onclick=\"{{ stopProp }}\" style=\"{{ opt.linkStyle }}\">{{ opt.sub }}<\u002Fa><\u002Fsc-if>\n          <\u002Fdiv>\n          <sc-if value=\"{{ opt.canEdit }}\">\n            <button onclick=\"{{ opt.onEdit }}\" title=\"Edit your suggestion\" style=\"{{ opt.editStyle }}\">\n              <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M14.06 5.19l3.75 3.75M3 17.25V21h3.75L17.81 9.94a1.5 1.5 0 000-2.12l-1.63-1.63a1.5 1.5 0 00-2.12 0L3 17.25z\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n            <\u002Fbutton>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ opt.showTally }}\">\n            <div style=\"display:flex;flex:0 0 auto;\">\n              <sc-for list=\"{{ opt.voters }}\" as=\"av\">\n                <span style=\"{{ av.style }}\">{{ av.initial }}<\u002Fspan>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fsc-for>\n\n      <sc-if value=\"{{ qSuggestable }}\">\n        <div style=\"displa th:360px;\">Vote on at least one stop and your optimized route will appear here.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <div style=\"{{ itinBarStyle }}\">\n    <button onclick=\"{{ onStartVote }}\" style=\"{{ itinVoteBtnStyle }}\">✎ Vote / change answers<\u002Fbutton>\n    <button onclick=\"{{ onShare }}\" style=\"{{ itinShareBtnStyle }}\">Share ↗<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- TOAST -->\n  <sc-if value=\"{{ toast }}\">\n    <div style=\"position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:#1B1B1B;color:#F7EFD8;font-family:'Poppins',sans-serif;font-weight:600;font-size:16px;padding:13px 24px;border-radius:999px;z-index:50;animation:mrtToast .25s ease;box-shadow:0 10px 30px rgba(0,0,0,.3);\">{{ toast }}<\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- LIVE SYNC INDICATOR -->\n  <sc-if value=\"{{ synced }}\">\n    <div style=\"position:fixed;left:16px;bottom:16px;display:flex;align-items:center;gap:7px;background:rgba(27,27,27,.42);backdrop-filter:blur(4px);border-radius:999px;padding:6px 13px 6px 11px;z-index:40;pointer-events:none;\">\n      <span style=\"width:8px;height:8px;border-radius:50%;background:#7AD98A;animation:mrtSyncPulse 2s ease-in-out infinite;\"><\u002Fspan>\n      <span style=\"font-family:'Poppins',sans-serif;font-weight:600;font-size:12px;letter-spacing:.4px;color:rgba(247,239,216,.85);\">Live<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900},&quot;seedDemoVotes&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;showLiveTally&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;defaultTab&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;list&quot;,&quot;map&quot;],&quot;default&quot;:&quot;list&quot;,&quot;tsType&quot;:&quot;string&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    screen: 'welcome',\n    qIndex: 0,\n    me: null,\n    pending: null,\n    itinTab: 'list',\n    itinEdit: false,\n    dragKey: null,\n    dragOverKey: null,\n    draft: '',\n    draftNote: '',\n    editingId: null,\n    editDraft: '',\n    editNote: '',\n    editDraft: '',\n    editNote: '',\n    routeBuilding: false,\n    toast: '',\n    data: { votes: {}, suggestions: {} },\n    loaded: false,\n    vw: (typeof window !== 'undefined' ? window.innerWidth : 1200),\n    synced: false,\n  };\n\n  KEY = 'mrt_state_v2';\n  SB_URL = 'https://rbifpsfupjyvpjbxxlgt.supabase.co';\n  SB_KEY = 'sb_publishable_skwANVAhSTcvmy9UOFl-KA_G9GNXaro';\n  SHARED_ID = 'mrt_shared';\n  VOTERS = ['Joyce', 'Jean', 'Edith', 'Son'];\n  INI = { Joyce: 'J', Jean: 'Je', Edith: 'E', Son: 'S' };\n\n  QUESTIONS = [\n    { id: 'stay', title: 'Treebones is booked up — hotel or airbnb?', region: 'Stay', multi: true, suggestable: true,\n      options: [\n        { id: 'abnb_mont', label: 'Airbnb in Monterey' },\n        { id: 'abnb_bs', label: 'Airbnb in Big Sur' },\n        { id: 'hotel_mont', label: 'Hotel in Monterey' },\n        { id: 'camp', label: 'Campground' },\n      ] },\n    { id: 'do', title: 'What would you like to do?', region: 'Monterey', multi: true, suggestable: true,\n      options: [\n        { id: 'aquarium', label: 'Aquarium | Monterey', sub: 'Tickets · $65/person' },\n        { id: '17mile', label: '17 Mile Drive | Monterey', sub: 'Scenic coastal loop' },\n      ] },\n    { id: 'hike', title: 'In Big Sur, which hike would you like to do?', region: 'Big Sur', multi: false, suggestable: true,\n      options: [\n        { id: 'pfeiffer', label: 'Pfeiffer Falls Trail to Pfeiffer Park', sub: '1.7 miles · 1–1.5 hrs' },\n        { id: 'partington', label: 'Partington Cove', sub: '1.2 miles · 1 hr' },\n      ] },\n  ];\n\n  componentDidMount() {\n    let data = null;\n    try { const raw = localStorage.getItem(this.KEY); if (raw) data = JSON.parse(raw); } catch (e) {}\n    if (!data) {\n      if (this.props.seedDemoVotes !== false) {\n        data = { votes: {\n          Joyce: { do: ['aquarium'], hike: 'pfeiffer', stay: ['hotel_mont'] },\n          Jean: { do: ['aquarium', '17mile'], hike: 'pfeiffer', stay: ['abnb_mont', 'hotel_mont'] },\n          Edith: { do: ['17mile'], hike: 'partington', stay: ['hotel_mont'] },\n        }, suggestions: {} };\n      } else {\n        data = { votes: {}, suggestions: {} };\n      }\n    }\n    this.setState({ data, loaded: true, itinTab: this.props.defaultTab || 'list' });\n    this._onResize = () => { if (Math.abs(window.innerWidth - this.state.vw) > 0) this.setState({ vw: window.innerWidth }); };\n    window.addEventListener('resize', this._onResize);\n    this._initSupabase();\n  }\n\n  componentWillUnmount() {\n    if (this._onResize) window.removeEventListener('resize', this._onResize);\n    clearTimeout(this._tt); clearTimeout(this._rt); clearTimeout(this._saveT); clearInterval(this._poll);\n    if (this._onVis) document.removeEventListener('visibilitychange', this._onVis);\n    try { if (this._chan && this._sb) this._sb.removeChannel(this._chan); } catch (e) {}\n  }\n\n  // ---- Supabase real-time sync (falls back to localStorage if unavailable) ----\n  _initSupabase() {\n    const start = Date.now();\n    const tryInit = () => {\n      if (!(window.supabase && window.supabase.createClient)) {\n        if (Date.now() - start < 7000) { setTimeout(tryInit, 150); }\n        return; // give up → localStorage-only\n      }\n      let sb;\n      try { sb = window.supabase.createClient(this.SB_URL, this.SB_KEY); } catch (e) { return; }\n      this._sb = sb;\n      // Load the shared row\n      sb.from('app_state').select('data').eq('id', this.SHARED_ID).maybeSingle().then(\n        ({ data: row, error }) => {\n          if (error) { this._sb = null; return; }\n          if (row && row.data) this._applyRemote(row.data);\n          else this._remoteSave(this.state.data, true); // seed the shared row from local\n          this.setState({ synced: true });\n          this._startPoll(); // safety net in case realtime replication isn't enabled\n        },\n        () => { this._sb = null; }\n      );\n      // Subscribe to real-time changes from other users\n      try {\n        this._chan = sb.channel('mrt_shared_state')\n          .on('postgres_changes',\n            { event: '*', schema: 'public', table: 'app_state', filter: 'id=eq.' + this.SHARED_ID },\n            (payload) => { const nd = payload && payload.new && payload.new.data; if (nd) this._applyRemote(nd); })\n          .subscribe();\n      } catch (e) {}\n    };\n    tryInit();\n  }\n\n  _fetchShared() {\n    if (!this._sb) return;\n    this._sb.from('app_state').select('data').eq('id', this.SHARED_ID).maybeSingle().then(\n      ({ data: row }) => { if (row && row.data) this._applyRemote(row.data); },\n      function () {}\n    );\n  }\n  _startPoll() {\n    clearInterval(this._poll);\n    this._poll = setInterval(() => { if (this._sb && !document.hidden) this._fetchShared(); }, 4000);\n    this._onVis = () => { if (!document.hidden) this._fetchShared(); };\n    document.addEventListener('visibilitychange', this._onVis);\n  }\n\n  _applyRemote(data) {\n    if (!data) return;\n    try { if (JSON.stringify(data) === JSON.stringify(this.state.data)) return; } catch (e) {}\n    try { localStorage.setItem(this.KEY, JSON.stringify(data)); } catch (e) {}\n    this.setState({ data });\n  }\n\n  _remoteSave(data, immediate) {\n    if (!this._sb) return;\n    clearTimeout(this._saveT);\n    const doSave = () => {\n      if (!this._sb) return;\n      try { this._sb.from('app_state').upsert({ id: this.SHARED_ID, data: data }).then(function () {}, function () {}); } catch (e) {}\n    };\n    if (immediate) doSave(); else this._saveT = setTimeout(doSave, 250);\n  }\n\n
